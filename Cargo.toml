[workspace]
resolver = "2"
members = ["crates/safefetch-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/Simon-grtl/safefetch"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "deny"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
