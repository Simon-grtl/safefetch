name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Linux system dependencies (Tauri + ClamAV)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev libdbus-1-dev clamav clamav-daemon
          sudo systemctl stop clamav-freshclam || true

      # Official ClamAV installer, NOT Homebrew: Homebrew's clamav 1.5.4_1 is
      # built on OpenSSL 4 and cannot hash files ("fmap_get_hash: error
      # calculating sha2-256 hash"), see Cisco-Talos/clamav#1887.
      - name: macOS ClamAV (official package)
        if: runner.os == 'macOS'
        env:
          CLAMAV_VERSION: "1.5.4"
        run: |
          PKG=clamav-$CLAMAV_VERSION.macos.universal.pkg
          curl -fsSL -o "$RUNNER_TEMP/$PKG" "https://github.com/Cisco-Talos/clamav/releases/download/clamav-$CLAMAV_VERSION/$PKG"
          pkgutil --check-signature "$RUNNER_TEMP/$PKG" || true
          sudo installer -pkg "$RUNNER_TEMP/$PKG" -target /
          dirname "$(find /usr/local/clamav -type f -name clamscan | head -1)" >> "$GITHUB_PATH"
          ls -la /usr/local/clamav

      - name: Windows ClamAV
        if: runner.os == 'Windows'
        run: choco install clamav -y --no-progress

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (ClamAV required — EICAR, archives, limits)
        env:
          SAFEFETCH_REQUIRE_CLAMAV: "1"
        run: cargo test --workspace

      - name: clamd integration (Linux)
        if: runner.os == 'Linux'
        run: |
          D=$RUNNER_TEMP/clamd; mkdir -p $D/db
          echo "44d88612fea8a8f36de82e1278abb02f:68:SafeFetch.Test.EICAR" > $D/db/test.hdb
          cat > $D/clamd.conf <<EOF
          LocalSocket $D/clamd.sock
          Foreground yes
          DatabaseDirectory $D/db
          AlertExceedsMax yes
          AlertEncrypted yes
          MaxFileSize 2047M
          MaxScanSize 4000M
          StreamMaxLength 2047M
          EOF
          # Ubuntu's AppArmor profile is attached to /usr/sbin/clamd and forbids
          # sockets/databases outside /var/run/clamav and /var/lib/clamav.
          # A copy of the binary at another path runs unconfined (CI only).
          cp /usr/sbin/clamd $D/clamd-ci
          $D/clamd-ci -c $D/clamd.conf &
          for i in $(seq 1 60); do [ -S $D/clamd.sock ] && break; sleep 1; done
          [ -S $D/clamd.sock ] || { echo "::error::clamd did not start"; exit 1; }
          SAFEFETCH_CLAMD_CONF=$D/clamd.conf cargo test -p safefetch-core --test clamd

      - name: Large file test (3 GiB, Linux only)
        if: runner.os == 'Linux'
        run: cargo test --release -p safefetch-core --test large -- --ignored

      - name: Release build must not contain tauri-connector
        shell: bash
        run: |
          if cargo tree -p safefetch -e normal --target all | grep -i "tauri-plugin-connector"; then
            echo "::error::tauri-plugin-connector is in the default dependency tree"; exit 1
          fi
          # Enabling the dev feature in a release build must fail to compile.
          if cargo check -p safefetch --release --features dev-connector 2>/dev/null; then
            echo "::error::dev-connector compiled in release mode"; exit 1
          fi

  linux-distros:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Arch Linux
            image: archlinux:latest
          - name: CachyOS
            image: cachyos/cachyos:latest
    container: ${{ matrix.image }}
    steps:
      - name: System packages (pacman)
        run: pacman -Syu --noconfirm --needed base-devel git rust webkit2gtk-4.1 gtk3 dbus clamav

      - uses: actions/checkout@v5

      # Arch/CachyOS are rebuilding ClamAV on OpenSSL 4, which breaks file
      # hashing (Cisco-Talos/clamav#1887). If the distro's ClamAV is broken,
      # warn and run the rest of the suite without it instead of failing on
      # a problem that is not SafeFetch's.
      - name: ClamAV self-check
        shell: bash
        run: |
          D=$(mktemp -d); mkdir -p $D/db
          echo "44d88612fea8a8f36de82e1278abb02f:68:SafeFetch.Test.EICAR" > $D/db/test.hdb
          printf '%s' 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' > $D/eicar.txt
          clamscan --version
          if clamscan --no-summary -d $D/db $D/eicar.txt 2>&1 | tee $D/out | grep -q "SafeFetch.Test.EICAR.* FOUND" \
             && ! grep -q "LibClamAV Error" $D/out; then
            echo "SAFEFETCH_REQUIRE_CLAMAV=1" >> "$GITHUB_ENV"
          else
            cat $D/out
            echo "::warning::The distribution's ClamAV package is broken (see Cisco-Talos/clamav#1887); ClamAV tests skipped on ${{ matrix.name }}"
            pacman -Rns --noconfirm clamav
          fi

      - name: Tests
        run: cargo test --workspace --locked

      - name: Build and install the package (PKGBUILD / makepkg)
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd -m builder
          B=/home/builder/pkg; mkdir -p $B
          cp packaging/arch/PKGBUILD $B/
          ver=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          git archive --prefix="safefetch-$ver/" -o "$B/safefetch-$ver.tar.gz" HEAD
          chown -R builder $B
          cd $B && su builder -c "makepkg -f --skipchecksums --nodeps"
          pacman -U --noconfirm --nodeps $B/safefetch-*.pkg.tar.zst
          test -x /usr/bin/safefetch
          test -f /usr/share/applications/io.github.safefetch.app.desktop
          pacman -S --noconfirm --needed namcap && namcap $B/safefetch-*.pkg.tar.zst || true

  supply-chain:
    name: cargo-deny & cargo-audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --deny warnings

  semgrep:
    name: Semgrep
    runs-on: ubuntu-22.04
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v5
      - name: Semgrep (project rules + Rust/JS/secrets packs)
        run: semgrep scan --error --config .semgrep/ --config p/rust --config p/javascript --config p/secrets --exclude target
