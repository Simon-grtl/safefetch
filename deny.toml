# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Only "unmaintained" notices, all transitive through Tauri's Linux stack.
# Not vulnerabilities. Re-evaluate at every release (`cargo deny check advisories`).
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: build-time proc-macro via gtk-rs 0.18 (Tauri Linux)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained: via zbus <- tauri-plugin-opener (Linux D-Bus)" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained: via zbus <- tauri-plugin-opener (Linux D-Bus)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained: via zbus <- tauri-plugin-opener (Linux D-Bus)" },
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18 VariantStrIter unsound; not reachable from SafeFetch code" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # OpenSSL is deliberately excluded: TLS is rustls only.
    { crate = "openssl-sys", wrappers = [] },
    { crate = "native-tls", wrappers = [] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
